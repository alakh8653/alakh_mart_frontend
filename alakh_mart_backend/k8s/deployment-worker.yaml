apiVersion: apps/v1
kind: Deployment
metadata:
  name: alakh-mart-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alakh-mart-worker
  template:
    metadata:
      labels:
        app: alakh-mart-worker
    spec:
      containers:
        - name: worker
          image: alakh-mart-web:latest
          command: ["celery", "-A", "alakh_mart", "worker", "--loglevel=info"]
          env:
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
