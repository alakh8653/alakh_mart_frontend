apiVersion: apps/v1
kind: Deployment
metadata:
  name: alakh-mart-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alakh-mart-web
  template:
    metadata:
      labels:
        app: alakh-mart-web
    spec:
      containers:
        - name: web
          image: alakh-mart-web:latest
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: alakh_mart.settings
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: alakh-mart-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /api/schema/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
