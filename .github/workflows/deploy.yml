name: CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push image
        run: |
          docker build -t ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::8} alakh_mart_backend
          docker push ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::8}
        env:
          REGISTRY: ${{ secrets.REGISTRY_HOST }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
      - name: Setup Helm
        uses: azure/setup-helm@v3
      - name: Configure kubeconfig
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'
      - name: Deploy via Helm
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          REGISTRY: ${{ secrets.REGISTRY_HOST }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 --decode > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          # Deploy to staging first
          helm upgrade --install alakh-mart-staging ./alakh_mart_backend/helm-chart \
            --set image.repository=${REGISTRY}/${IMAGE_NAME} --set image.tag=${GITHUB_SHA::8} --set staging.enabled=true
          # If deploying to production, require manual approval in GH Actions or separate workflow
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            helm upgrade --install alakh-mart-prod ./alakh_mart_backend/helm-chart \
              --set image.repository=${REGISTRY}/${IMAGE_NAME} --set image.tag=${GITHUB_SHA::8} --set production.enabled=true
          fi
